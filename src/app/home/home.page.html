<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Novo Orçamento</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Valor da Diária (R$)</ion-label>
    <ion-input type="number" [(ngModel)]="valorDiaria" min="1"></ion-input>
  </ion-item>
  <ion-item class="ion-margin-top">
    <ion-label>Quantidade de dias: {{ dias }}</ion-label>
  </ion-item>
  <ion-range min="1" max="30" pin="true" [(ngModel)]="dias">
    <ion-label slot="start">1</ion-label>
    <ion-label slot="end">30</ion-label>
  </ion-range>
  <ion-button expand="block" class="ion-margin-top" (click)="continuar()">
    Calcular e Continuar
  </ion-button>
</ion-content>
